name: CI / Deploy

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  backend:
    name: Backend Tests & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest httpx
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -e backend/ || pip install -r backend/requirements.txt

      - name: Run Ruff Linting
        run: |
          ruff check backend/

      - name: Run Pytest Unit Tests
        run: |
          pytest backend/tests/unit/ -v

  frontend:
    name: Frontend Tests & Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: Run Vitest Unit Tests
        run: npm run test

      # NEXT_PUBLIC_API_URL: Configured via GitHub Repo Settings > Secrets and variables > Actions > Variables.
      # Must point to your deployed FastAPI backend (e.g. https://your-backend.onrender.com).
      # If unset or empty, the frontend runs offline-safe and prompts for backend configuration in Settings.
      - name: Build Next.js static export
        env:
          BASE_PATH: /WildLens-AI
          NEXT_PUBLIC_BASE_PATH: /WildLens-AI
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
        run: npm run build

      - name: Verify generated entry point
        run: |
          if [ ! -f out/index.html ]; then
            echo "::error::Generated entry point out/index.html not found!"
            exit 1
          fi
          if [ ! -f out/404.html ]; then
            echo "::error::Generated fallback out/404.html not found!"
            exit 1
          fi
          echo "Verified entry point out/index.html exists ($(wc -c < out/index.html) bytes)."
          # Create .nojekyll so GitHub Pages does not ignore _next assets
          touch out/.nojekyll

      - name: Upload GitHub Pages artifact
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/out

  deploy:
    name: Deploy to GitHub Pages
    needs: [backend, frontend]
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: "pages"
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

